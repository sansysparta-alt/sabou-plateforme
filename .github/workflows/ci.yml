# Intégration continue : ce fichier ne fait qu'appeler les scripts de infra/ci/
# (même logique sur GitLab CI après US-008). Actions épinglées par SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, tests, compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version de pnpm lue dans le champ packageManager du package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash infra/ci/check-repo.sh
      - run: bash infra/ci/check-repo-selftest.sh
      - run: bash infra/ci/install.sh
      - run: bash infra/ci/lint.sh
      - run: bash infra/ci/test.sh
      - run: bash infra/ci/build.sh
      - run: bash infra/ci/e2e.sh
      - run: bash infra/ci/audio-lecture.sh

  admin-e2e:
    name: Application de gestion et compte citoyen de bout en bout (axe)
    runs-on: ubuntu-24.04
    # Vitesse (Lighthouse) en fin de sprint seulement : workflow fin-de-sprint.yml (05 §2.73)
    env:
      RECIT_LIGHTHOUSE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash infra/ci/install.sh
      - run: bash infra/ci/e2e-admin.sh
