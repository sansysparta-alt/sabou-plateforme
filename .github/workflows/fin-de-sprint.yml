# Vitesse et sécurité : en fin de sprint et avant toute mise en production, sans bloquer
# chaque fusion (décision du maître d'œuvre du 19 novembre 2026, 05 §2.73). Lancé à la main
# (onglet Actions, « Fin de sprint », ou « gh workflow run fin-de-sprint.yml --ref <branche> »)
# et après chaque fusion dans main. Le fonctionnement est prouvé avant fusion par ci.yml.
name: Fin de sprint

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fin-de-sprint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lighthouse:
    name: 'Vitesse (Lighthouse) : gestion, site, connexion'
    runs-on: ubuntu-24.04
    env:
      RECIT_ADMIN_SPECS: '-'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash infra/ci/install.sh
      - run: bash infra/ci/e2e-admin.sh

  audit:
    name: Analyse des dépendances (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash infra/ci/audit.sh
      - run: bash infra/ci/audit-selftest.sh

  semgrep:
    name: Analyse du code (Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash infra/ci/semgrep.sh
      - run: bash infra/ci/semgrep-selftest.sh
