# Thème de connexion du site public (lot D : US-014) : celui de l'administration (« sabou »),
# avec le numéro de téléphone comme identifiant et un lien vers l'inscription.
parent=sabou
import=common/keycloak
locales=fr,en
# Lu par login.ftl du thème « sabou » : champ téléphone, aide et lien d'inscription
sabouPhoneLogin=true
scripts=js/telephone.js
# Site public (US-069) : page « Mot de passe oublié », par SMS ; lue dans l'environnement du
# conteneur Keycloak, pour tous les clients du domaine (site et application mobile)
sabouSiteUrl=${env.SABOU_SITE_URL}
