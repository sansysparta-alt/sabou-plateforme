# Thème de connexion SABOU (US-010) : gabarits de base de Keycloak, une seule feuille de style
# légère (pas de PatternFly) pour tenir les seuils de Lighthouse en 3G et WCAG 2.2 AA (axe).
parent=base
import=common/keycloak
locales=fr,en

styles=css/tokens.css css/sabou.css
meta=viewport==width=device-width,initial-scale=1 robots==noindex,nofollow

kcHtmlClass=sabou
kcLoginClass=sabou-login
kcFormCardClass=sabou-card
kcFormHeaderClass=sabou-header
kcFormGroupClass=sabou-field
kcLabelClass=sabou-label
kcInputClass=sabou-input
kcInputGroup=sabou-input-group
kcInputErrorMessageClass=sabou-error
kcInputHelperTextBeforeClass=sabou-help
kcInputHelperTextAfterClass=sabou-help
kcFormSettingClass=sabou-options
kcFormOptionsWrapperClass=sabou-options-links
kcButtonClass=sabou-button
kcButtonPrimaryClass=sabou-button--primary
kcButtonDefaultClass=sabou-button--secondary
kcButtonSecondaryClass=sabou-button--secondary
kcButtonBlockClass=sabou-button--block
kcButtonLargeClass=
kcFormPasswordVisibilityButtonClass=sabou-reveal
kcFormPasswordVisibilityIconShow=sabou-reveal__show
kcFormPasswordVisibilityIconHide=sabou-reveal__hide
kcAlertClass=sabou-alert
kcAlertTitleClass=sabou-alert__text
kcFeedbackErrorIcon=
kcFeedbackWarningIcon=
kcFeedbackSuccessIcon=
kcFeedbackInfoIcon=
kcLocaleMainClass=sabou-locale
kcLocaleListClass=sabou-locale__list
kcLocaleItemClass=sabou-locale__item
kcRecoveryCodesList=sabou-codes
kcRecoveryCodesActions=sabou-codes-actions
kcRecoveryCodesConfirmation=sabou-codes-confirm
kcCheckboxInputClass=sabou-checkbox

# Choix d'une autre méthode (refonte de l'authentification) : une ligne par méthode, sans icône
kcSelectAuthListClass=sabou-methods
kcSelectAuthListItemClass=sabou-method
kcSelectAuthListItemIconClass=sabou-hidden
kcSelectAuthListItemBodyClass=sabou-method__body
kcSelectAuthListItemHeadingClass=sabou-method__title
kcSelectAuthListItemDescriptionClass=sabou-method__help
kcSelectAuthListItemFillClass=sabou-hidden
kcSelectAuthListItemArrowClass=sabou-hidden
