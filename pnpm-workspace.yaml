packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - globals@17.14.0
# Scripts d'installation des dépendances : refusés sauf nécessité prouvée (chaîne logicielle).
# Ceux-ci viennent de Testcontainers et ne servent à rien ici : module natif facultatif de
# ssh2 (accès Docker distant par SSH, inutilisé) et contrôle de version de protobufjs.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
# @nestjs/platform-express importe rxjs sans le déclarer : sans cette ligne, il prend la version
# remontée dans node_modules, qui peut être rxjs 6 (amené par @lhci/cli) au lieu de rxjs 7.
packageExtensions:
  '@nestjs/platform-express':
    peerDependencies:
      rxjs: '^7.8.0'
