name: sabou_mobile
description: "Application mobile SABOU (praticiens et agents de terrain)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  http: ^1.6.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  powersync: 2.5.0
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^3.8.0

flutter:
  uses-material-design: true

# Base du téléphone chiffrée (US-004) : SQLite remplacé par SQLCipher à la compilation
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
